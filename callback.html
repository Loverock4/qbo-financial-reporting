<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Complete — 2568551 Ontario Inc. QuickBooks Integration</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#1a1a1a;line-height:1.6}
  h1{font-size:1.4rem} .box{background:#f4f6f8;border:1px solid #d0d7de;border-radius:8px;padding:14px 16px;margin:14px 0;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem}
  .label{color:#57606a;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  button{font-size:.9rem;padding:8px 14px;border:1px solid #0a66c2;background:#0a66c2;color:#fff;border-radius:6px;cursor:pointer}
  .err{color:#b91c1c} .ok{color:#137333;font-weight:600}
</style>
</head>
<body>
  <h1>QuickBooks Authorization</h1>
  <div id="content">Reading authorization response…</div>

<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("code");
  var realmId = q.get("realmId");
  var state = q.get("state");
  var error = q.get("error");
  var desc = q.get("error_description");
  var el = document.getElementById("content");

  if (error) {
    el.innerHTML = '<p class="err"><strong>Authorization error:</strong> ' +
      escapeHtml(error) + (desc ? ' — ' + escapeHtml(desc) : '') +
      '</p><p>Please try the authorization link again.</p>';
    return;
  }
  if (!code) {
    el.innerHTML = '<p class="err">No authorization code found in the URL. ' +
      'Open this page only via the QuickBooks authorization flow.</p>';
    return;
  }

  var bundle = JSON.stringify({ code: code, realmId: realmId, state: state });
  el.innerHTML =
    '<p class="ok">✓ Authorization succeeded.</p>' +
    '<p>Copy the block below and paste it back into your chat to finish connecting this company.</p>' +
    '<div class="label">Copy this</div>' +
    '<div class="box" id="bundle">' + escapeHtml(bundle) + '</div>' +
    '<button onclick="copyBundle()">Copy to clipboard</button>' +
    '<p style="margin-top:18px" class="label">Details</p>' +
    '<div class="box">realmId: ' + escapeHtml(realmId || '(none)') +
    '<br>state: ' + escapeHtml(state || '(none)') + '</div>' +
    '<p>You can close this tab after copying.</p>';

  window.copyBundle = function () {
    var t = document.getElementById("bundle").innerText;
    navigator.clipboard.writeText(t).then(function () {
      var b = document.querySelector("button");
      b.innerText = "Copied ✓";
    });
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
})();
</script>
</body>
</html>
